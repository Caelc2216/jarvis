<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #070B10; --panel: #0D141C; --line: #1C2A36; --text: #E6F1F7; --muted: #8AA1B1;
    --accent: #3FD4FF; --warm: #FFB547; --idle: #6F8797; --c: var(--accent);
    --mono: 'JetBrains Mono', Consolas, monospace; --sans: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text); font-family: var(--sans);
               overflow: hidden; user-select: none; }
  body.idle { --c: var(--idle); } body.thinking { --c: var(--warm); }

  .app { height: 100%; display: grid; gap: 18px; padding: 20px 22px;
         grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; }

  /* Voice / Text switch */
  .modes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
  .modes button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
                  font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--muted);
                  padding: 5px 10px; border-radius: 999px; transition: background .2s, color .2s; }
  .modes button:hover { color: var(--text); }
  .modes button[aria-pressed="true"] { background: #12303D; color: var(--accent); }
  .modes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .modes svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* Text mode: the message box */
  .composer { display: none; flex-direction: column; gap: 8px; }
  [data-input="text"] .composer { display: flex; }
  .composer .row { display: flex; gap: 8px; }
  .composer input[type=text] { flex: 1; min-width: 0; background: var(--panel); color: var(--text);
                  border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; font: 15px var(--sans);
                  user-select: text; outline: none; transition: border-color .2s; }
  .composer input[type=text]:focus { border-color: var(--accent); }
  .composer input[type=text]::placeholder { color: var(--idle); }
  .send { all: unset; cursor: pointer; width: 44px; display: grid; place-items: center; border-radius: 12px;
          background: #12303D; color: var(--accent); }
  .send:hover { background: #17404F; } .send:focus-visible { outline: 2px solid var(--accent); }
  .send svg { width: 18px; height: 18px; }
  .aloud { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; cursor: pointer;
           font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; color: var(--muted); }
  .aloud input { position: absolute; opacity: 0; pointer-events: none; }
  .aloud .sw { width: 30px; height: 17px; border-radius: 9px; background: var(--line); position: relative;
               transition: background .2s; flex-shrink: 0; }
  .aloud .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
                      border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
  .aloud input:checked + .sw { background: #12303D; }
  .aloud input:checked + .sw::after { transform: translateX(13px); background: var(--accent); }
  .aloud input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
  [data-input="text"] .orb { width: min(170px, 40vw, 26vh); }

  /* Code mode */
  .chip.code { color: var(--accent); border-color: #1D4A5C; }
  .brand { min-width: 0; flex: 1 1 auto; } .meta { flex-shrink: 0; } .brand > svg { flex-shrink: 0; }
  .chip { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .approval { display: none; width: min(560px, 100%); background: var(--panel); border: 1px solid var(--warm);
              border-radius: 14px; padding: 14px 16px; flex-shrink: 0; }
  .approval.on { display: block; }
  .approval .k { color: var(--warm); }
  .approval .q { margin: 6px 0 12px; font-size: 15px; line-height: 1.4; word-break: break-word; user-select: text; }
  .approval .btns { display: flex; gap: 8px; }
  .btn { all: unset; cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
         padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); color: var(--text); }
  .btn:hover { border-color: var(--muted); } .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.yes { background: #12303D; border-color: #1D4A5C; color: var(--accent); }
  .stopbtn { display: none; }
  .stopbtn.on { display: inline-flex; }
  [data-approval="on"] .orb { width: min(140px, 34vw, 20vh); }
  @media (max-width: 899px) { .modes .t { display: none; } .modes button { padding: 5px 8px; } }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .word { font-weight: 700; letter-spacing: .32em; font-size: 16px; }
  .chip { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--muted);
          border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
  .chip:empty { display: none; }
  .meta { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip, .word { white-space: nowrap; }
  @media (max-width: 899px) { #brain { display: none; } .word { letter-spacing: .26em; } }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--c); transition: background .3s; }
  .clock { color: var(--text); font-size: 15px; margin-left: 10px; }

  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 0; }
  .orb { width: min(300px, 62vw, 52vh); aspect-ratio: 1; }
  .orb svg { width: 100%; height: 100%; overflow: visible; }
  .orb circle, .orb g { transition: stroke .4s, fill .4s; }
  .r1, .r2, .core, .ping { transform-origin: 150px 150px; transform-box: view-box; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinback { to { transform: rotate(-360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes pulse { 0% { transform: scale(.7); opacity: .7; } 100% { transform: scale(1.25); opacity: 0; } }
  .r1 { animation: spin 40s linear infinite; } .r2 { animation: spinback 60s linear infinite; }
  .core { animation: breathe 5s ease-in-out infinite; } .ping { opacity: 0; }
  body.listening .r1 { animation-duration: 14s; } body.listening .r2 { animation-duration: 20s; }
  body.listening .ping { animation: pulse 1.6s ease-out infinite; }
  body.thinking .r1 { animation-duration: 2.2s; } body.thinking .r2 { animation-duration: 3s; }
  body.speaking .r1 { animation-duration: 9s; } body.speaking .r2 { animation-duration: 12s; }
  body.speaking .core { animation-duration: .9s; }
  .levelring { transform-origin: 150px 150px; transform-box: view-box; transition: transform .08s linear, opacity .2s; opacity: 0; }
  body.listening .levelring { opacity: .9; }

  .label { font-family: var(--mono); font-size: 13px; letter-spacing: .26em; color: var(--c); transition: color .3s; }
  .caption { margin: 0; max-width: 560px; min-height: 3em; text-align: center; font-size: 17px; line-height: 1.45;
             flex: 0 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 0 8px;
             scrollbar-width: thin; scrollbar-color: var(--line) transparent; user-select: text; }
  /* A long reply fades at the edges that have more text past them. */
  .caption.more-below { -webkit-mask-image: linear-gradient(#000 calc(100% - 2.2em), transparent); }
  .caption.more-above { -webkit-mask-image: linear-gradient(transparent, #000 2.2em); }
  .caption.more-above.more-below { -webkit-mask-image: linear-gradient(transparent, #000 2.2em, #000 calc(100% - 2.2em), transparent); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  .k { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--muted); }
  .talk { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .talk .v { font-size: 14px; margin-top: 4px; line-height: 1.35; overflow: hidden; display: -webkit-box;
             -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .talk .card:first-child .v:empty::after { content: "—"; color: var(--muted); }
  .jarvis-k { color: var(--accent); }

  .side { display: none; flex-direction: column; gap: 12px; min-width: 0; }
  .np { display: flex; align-items: center; gap: 12px; }
  .np .art { width: 46px; height: 46px; border-radius: 10px; background: #11202B; display: grid; place-items: center; flex-shrink: 0; }
  .np .t { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .a { font-size: 12.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .st { font-family: var(--mono); font-size: 11px; color: var(--warm); margin-top: 3px; }
  ol.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px;
           font-family: var(--mono); font-size: 12px; }
  ol.log li { display: flex; gap: 10px; } ol.log .t { color: var(--accent); flex-shrink: 0; } ol.log .x { color: #CFDDE6; }
  ol.log:empty::after { content: "Nothing yet."; color: var(--muted); }
  .big { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .sub { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 3px; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .tags span { font-size: 12.5px; padding: 5px 9px; border-radius: 8px; background: #11202B; color: #CFEFFF; }

  /* Wide window: the full HUD with side panels. */
  @media (min-width: 900px) {
    .app { grid-template-columns: 260px minmax(0, 1fr) 290px; grid-template-rows: auto 1fr auto; padding: 26px 34px; gap: 22px 28px; }
    header { grid-column: 1 / -1; } .talk, .composer { grid-column: 1 / -1; }
    [data-input="text"] .orb { width: min(260px, 26vw, 34vh); }
    .side { display: flex; } .orb { width: min(400px, 40vw, 58vh); }
    .caption { font-size: 21px; } .word { font-size: 20px; }
  }
  /* Short widget: drop the transcript cards. */
  @media (max-height: 520px) and (max-width: 899px) { .talk { display: none; } }
</style>
</head>
<body class="idle">
<div class="app">
  <header>
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#3FD4FF" stroke-width="2"/><circle cx="17" cy="17" r="6" fill="#3FD4FF"/></svg>
      <div class="word">JARVIS</div>
      <div class="chip" id="routine"></div>
      <div class="chip code" id="coding"></div>
    </div>
    <div class="meta">
      <div class="modes" role="group" aria-label="How to talk to Jarvis">
        <button type="button" data-mode="voice" aria-pressed="true" title="Voice: say “Hey Jarvis”">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="t">VOICE</span></button>
        <button type="button" data-mode="text" aria-pressed="false" title="Text: type to Jarvis (microphone off)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span class="t">TEXT</span></button>
      </div>
      <span class="dot"></span><span id="brain"></span><span class="clock" id="clock"></span>
    </div>
  </header>

  <aside class="side" aria-label="System">
    <div class="k">SYSTEM</div>
    <div class="card"><div class="k">BRAIN</div><div class="big" id="brain2">—</div></div>
    <div class="card"><div class="k">WAKE</div><div class="tags"><span>“Hey Jarvis”</span></div></div>
    <div class="card"><div class="k">TODAY</div><div class="big" id="date"></div><div class="sub" id="time2"></div></div>
  </aside>

  <section class="center" aria-live="polite">
    <div class="orb">
      <svg viewBox="0 0 300 300" role="img" aria-label="Jarvis status">
        <circle class="ping" cx="150" cy="150" r="118" fill="none" stroke="var(--c)" stroke-width="2"/>
        <circle class="levelring" id="levelring" cx="150" cy="150" r="96" fill="none" stroke="var(--c)" stroke-opacity=".5" stroke-width="2"/>
        <circle cx="150" cy="150" r="140" fill="none" stroke="#1C2A36" stroke-width="1"/>
        <g class="r1"><circle cx="150" cy="150" r="128" fill="none" stroke="var(--c)" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="2 9"/></g>
        <g class="r2"><circle id="r2" cx="150" cy="150" r="108" fill="none" stroke="var(--c)" stroke-width="3" stroke-dasharray="30 40" stroke-linecap="round"/></g>
        <circle cx="150" cy="150" r="86" fill="none" stroke="#1C2A36" stroke-width="6"/>
        <g class="core">
          <circle cx="150" cy="150" r="62" fill="#0E2633"/>
          <circle cx="150" cy="150" r="44" fill="#123B4D"/>
          <circle id="heart" cx="150" cy="150" r="24" fill="var(--c)" fill-opacity=".6"/>
        </g>
      </svg>
    </div>
    <div class="label" id="label">STANDING BY</div>
    <p class="caption" id="caption"></p>
    <div class="approval" id="approval" role="alertdialog" aria-labelledby="approval-k" aria-describedby="approval-q">
      <div class="k" id="approval-k">CLAUDE CODE WANTS TO</div>
      <div class="q" id="approval-q"></div>
      <div class="btns">
        <button type="button" class="btn yes" id="allow">ALLOW</button>
        <button type="button" class="btn" id="deny">DON'T ALLOW</button>
      </div>
    </div>
    <button type="button" class="btn stopbtn" id="stopbtn">STOP CODING TASK</button>
  </section>

  <aside class="side" aria-label="Activity">
    <div class="k">NOW PLAYING</div>
    <div class="card np">
      <div class="art"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CFEFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      <div style="min-width:0"><div class="t" id="np-t">Nothing playing</div><div class="a" id="np-a"></div><div class="st" id="np-s"></div></div>
    </div>
    <div class="k" style="margin-top:6px">ACTIVITY</div>
    <ol class="log" id="log"></ol>
  </aside>

  <div class="talk">
    <div class="card"><div class="k">YOU</div><div class="v" id="you"></div></div>
    <div class="card"><div class="k jarvis-k">JARVIS</div><div class="v" id="jarvis">Ready when you are.</div></div>
  </div>

  <form class="composer" id="composer" autocomplete="off">
    <div class="row">
      <input type="text" id="msg" maxlength="2000" placeholder="Type to Jarvis…" aria-label="Message to Jarvis">
      <button class="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <label class="aloud"><input type="checkbox" id="aloud"><span class="sw"></span>READ REPLIES ALOUD</label>
  </form>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const LOOK = {
    idle:      { label: 'STANDING BY', dash: '30 40',          glow: .5 },
    listening: { label: 'LISTENING',   dash: '80 30',          glow: .8 },
    thinking:  { label: 'THINKING',    dash: '20 14',          glow: .7 },
    speaking:  { label: 'SPEAKING',    dash: '120 50 30 50',   glow: .95 },
  };
  function render(s) {
    const look = LOOK[s.mode] || LOOK.idle;
    document.body.className = s.mode in LOOK ? s.mode : 'idle';
    const text = s.input === 'text';
    const wasText = document.documentElement.dataset.input === 'text';
    document.documentElement.dataset.input = text ? 'text' : 'voice';
    for (const b of document.querySelectorAll('.modes button')) b.setAttribute('aria-pressed', String(b.dataset.mode === s.input));
    $('aloud').checked = s.read_aloud !== false;
    if (text && !wasText && document.hasFocus()) setTimeout(() => $('msg').focus(), 0);
    $('label').textContent = text && s.mode === 'idle' ? 'TEXT MODE' : look.label;
    $('r2').setAttribute('stroke-dasharray', look.dash);
    $('heart').setAttribute('fill-opacity', look.glow);
    setCaption(s.mode === 'thinking' && !s.caption ? 'One moment…' : (s.caption || ''));
    $('you').textContent = s.you || '';
    $('jarvis').textContent = s.jarvis || 'Ready when you are.';
    $('brain').textContent = s.brain || '';
    $('brain2').textContent = s.brain || '—';
    $('routine').textContent = s.routine ? s.routine.toUpperCase() + ' MODE' : '';
    $('coding').textContent = s.coding ? 'CODING · ' + s.coding.toUpperCase() : '';
    $('stopbtn').classList.toggle('on', !!s.coding_busy && !s.approval);
    const ap = s.approval;
    $('approval').classList.toggle('on', !!ap);
    document.documentElement.dataset.approval = ap ? 'on' : 'off';
    if (ap && $('approval').dataset.id !== ap.id) {
      $('approval').dataset.id = ap.id;
      $('approval-q').textContent = ap.text.charAt(0).toUpperCase() + ap.text.slice(1);
    }
    const p = s.playing;
    $('np-t').textContent = p ? p.title : 'Nothing playing';
    $('np-a').textContent = p ? [p.artist, p.app].filter(Boolean).join(' · ') : '';
    $('np-s').textContent = p && p.status !== 'playing' ? p.status.toUpperCase() : '';
    const log = $('log'); log.replaceChildren();
    for (const a of s.activity || []) {
      const li = document.createElement('li');
      const t = document.createElement('span'); t.className = 't'; t.textContent = a.t;
      const x = document.createElement('span'); x.className = 'x'; x.textContent = a.text;
      li.append(t, x); log.append(li);
    }
  }
  // ---- Long replies: scroll along with the voice; any scrolling by the user takes over. ----
  const cap = $('caption');
  let follow = null;      // { start, duration } while auto-scrolling
  let manual = false;     // the user scrolled this reply themselves
  function edges() {
    const more = cap.scrollHeight - cap.clientHeight > 2;
    cap.classList.toggle('more-above', more && cap.scrollTop > 2);
    cap.classList.toggle('more-below', more && cap.scrollTop < cap.scrollHeight - cap.clientHeight - 2);
  }
  function setCaption(text) {
    if (cap.textContent === text) return;   // unrelated updates (music, activity) keep the scroll
    cap.textContent = text; cap.scrollTop = 0; manual = false; follow = null; edges();
  }
  // A timer rather than requestAnimationFrame: animation frames pause when the window is covered.
  setInterval(() => {
    if (!follow || manual) return;
    const frac = Math.min(1, (performance.now() - follow.start) / (follow.duration * 1000));
    const room = cap.scrollHeight - cap.clientHeight;
    if (room > 0) {
      // Keep the words being spoken a little above the middle of the box. (The voice may read only
      // the first part of a long answer; the rest stays on screen to scroll through.)
      const target = frac * follow.portion * cap.scrollHeight - cap.clientHeight * 0.4;
      cap.scrollTop = Math.max(0, Math.min(room, target));
    }
    edges();
    if (frac >= 1) follow = null;
  }, 50);
  function takeOver() {
    manual = true; follow = null;
    fetch('/reading', { method: 'POST' }).catch(() => {});  // keep the HUD up while they read
  }
  for (const ev of ['wheel', 'touchstart', 'pointerdown', 'keydown']) cap.addEventListener(ev, takeOver, { passive: true });
  cap.addEventListener('scroll', edges, { passive: true });
  window.addEventListener('resize', edges);

  function tick() {
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    $('date').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
    $('time2').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  tick(); setInterval(tick, 1000);
  // ---- Voice / text mode ----
  const TOKEN = '__JARVIS_TOKEN__';  // filled in by Jarvis when it serves this page
  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Jarvis-Token': TOKEN },
                         body: JSON.stringify(body) });
  }
  for (const b of document.querySelectorAll('.modes button')) {
    b.addEventListener('click', () => post('/settings', { input: b.dataset.mode }).catch(() => {}));
  }
  $('aloud').addEventListener('change', (e) => post('/settings', { read_aloud: e.target.checked }).catch(() => {}));
  $('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    const box = $('msg'), text = box.value.trim();
    if (!text) return;
    post('/ask', { text }).then((r) => { if (r.ok) box.value = ''; }).catch(() => {});
    box.focus();
  });

  // ---- Code mode ----
  const answer = (allow) => post('/coder/answer', { id: $('approval').dataset.id, allow }).catch(() => {});
  $('allow').addEventListener('click', () => answer(true));
  $('deny').addEventListener('click', () => answer(false));
  $('stopbtn').addEventListener('click', () => post('/coder/stop', {}).catch(() => {}));

  let lostJarvis = false;
  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => { if (lostJarvis) location.reload(); };  // Jarvis restarted (maybe updated): load the new page
    es.addEventListener('state', (e) => render(JSON.parse(e.data)));
    es.addEventListener('speak', (e) => {
      if (manual) return;
      const d = JSON.parse(e.data);
      follow = { start: performance.now(), duration: d.duration, portion: d.portion || 1 };
    });
    es.addEventListener('level', (e) => {
      const v = JSON.parse(e.data);
      $('levelring').style.transform = `scale(${1 + v * 0.35})`;
    });
    es.onerror = () => { es.close(); lostJarvis = true; document.body.className = 'idle'; $('label').textContent = 'OFFLINE';
                         $('caption').textContent = 'Jarvis isn’t running.'; setTimeout(connect, 3000); };
  }
  connect();
</script>
</body>
</html>
